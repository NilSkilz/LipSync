[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    ; WebSockets
    gilmaimon/ArduinoWebsockets@^0.5.3
    ; IMU
    electroniccats/MPU6050@^1.3.0
    ; JSON parsing
    bblanchon/ArduinoJson@^7.0.0
    ; WiFi Manager for easy setup
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

; For ESP32-S3 boards (like Seeed XIAO)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    gilmaimon/ArduinoWebsockets@^0.5.3
    electroniccats/MPU6050@^1.3.0
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
