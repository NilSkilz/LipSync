[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Use LittleFS for serving web files
board_build.filesystem = littlefs
; Partition scheme with 2MB app and 2MB filesystem (no OTA)
board_build.partitions = no_ota.csv

lib_deps =
    ; Async Web Server (includes WebSocket support)
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1
    ; IMU
    electroniccats/MPU6050@^1.3.0
    ; JSON parsing
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

; For ESP32-S3 boards (like Seeed XIAO)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs

lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1
    electroniccats/MPU6050@^1.3.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
